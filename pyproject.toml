[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gearwatch"
version = "0.1.0"
description = "Used camera gear price tracking from official marketplace APIs. Sold prices are signal; asking prices are noise."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Keivan Malhani" }]
keywords = ["camera", "photography", "pricing", "ebay", "resale", "statistics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Office/Business :: Financial",
]
# Zero runtime dependencies. This is a feature, not an oversight.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
gearwatch = "gearwatch.cli:main"

[project.urls]
Homepage = "https://github.com/keivanmalhani/gearwatch"
Source = "https://github.com/keivanmalhani/gearwatch"
Issues = "https://github.com/keivanmalhani/gearwatch/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
